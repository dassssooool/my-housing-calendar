name: Telegram delivery test
on:
  push:
    branches: [main]
    paths: [.github/workflows/telegram-test.yml]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send one test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          data = urllib.parse.urlencode({"chat_id": chat, "text": "🔔 청약 캘린더 텔레그램 알림 테스트입니다."}).encode()
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=data, timeout=20) as response:
                  if not json.load(response).get("ok"):
                      raise ValueError()
          except (OSError, ValueError):
              raise SystemExit("Telegram delivery failed") from None
          print("Telegram accepted the test message")
          PY

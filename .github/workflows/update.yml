name: Update housing notices
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch LH public notices
        id: lh_sync
        shell: bash
        env:
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
        run: |
          if [ -z "$LH_API_KEY" ]; then
            echo "LH_API_KEY not configured; LH sync skipped."
          else
            log=$(mktemp)
            trap 'rm -f "$log"' EXIT
            if python sync_lh.py 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -q '^RuntimeError: LH API timed out after 3 attempts' "$log"; then
              echo 'reason=LH API 응답 시간 초과 (총 3회 시도)' >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
      - name: Fetch official notices
        env:
          APPLYHOME_API_KEY: ${{ secrets.APPLYHOME_API_KEY }}
        run: python sync_applyhome.py
      - name: Publish data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notices.json
          if [ -f lh_notices.json ]; then git add lh_notices.json; fi
          git diff --cached --quiet || (git commit -m 'Update housing notices' && git push)
      - name: Notify Telegram of update result
        if: ${{ success() || (failure() && steps.lh_sync.outcome == 'failure') }}
        env:
          LH_SYNC_REASON: ${{ steps.lh_sync.outputs.reason }}
          LH_SYNC_OUTCOME: ${{ steps.lh_sync.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          if not token or not chat_id:
              raise SystemExit("Telegram notification secrets are missing")

          run_url = "{GITHUB_SERVER_URL}/{GITHUB_REPOSITORY}/actions/runs/{GITHUB_RUN_ID}".format_map(os.environ)
          if os.environ["LH_SYNC_OUTCOME"] == "failure":
              reason = os.environ.get("LH_SYNC_REASON") or "LH 공고 수집 오류 (상세 내용은 실행 로그 참고)"
              summary = f"⚠️ 청약 캘린더 업데이트 실패\n실패 사유: {reason}"
          else:
              summary = "✅ 청약 캘린더 업데이트 완료"
          text = f"{summary}\n실행 기록: {run_url}"
          body = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/sendMessage", data=body, timeout=20):
                  print("Telegram accepted the update notification")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Telegram rejected the notification (HTTP {exc.code})") from None
          except (OSError, ValueError):
              raise SystemExit("Telegram notification request failed") from None
          PY
